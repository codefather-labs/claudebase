name: install-smoke

# Installs claudebase onto a CLEAN machine and asserts the result, because that
# is the one thing the rest of the test suite structurally cannot do.
#
# On 2026-08-17 a first install onto a fresh Ubuntu 24.04 box surfaced four
# defects at once, every one of them invisible to the unit and integration
# suites:
#
#   1. `libssl-dev` was an undeclared build dependency. Since fixed at the root
#      by moving the TLS stack to rustls, so it is no longer needed at all —
#      the `ldd` assertion below is what keeps it from creeping back.
#   2. `cmake` + `clang` are needed by `--features asr-whisper` via bindgen, and
#      nothing said so.
#   3. `install_claudebase_hooks()` existed in both installers and was called by
#      NEITHER — so no hook had ever been installed by the installer. The hook
#      tests pass happily: they check the CONTENT of the hook files, not that
#      anything puts them in place.
#   4. The generated systemd USER unit carried `ProtectKernelModules=`, which
#      drops CAP_SYS_MODULE. systemd 259 tolerates it in a user unit; systemd
#      255 (Ubuntu 24.04 LTS) refuses, and the daemon crash-looped with
#      `218/CAPABILITIES`. A unit test asserted the directive must be PRESENT —
#      the suite was pinning the defect in place.
#
# The common thread: every prior install ran on a machine that already carried
# the state, often put there by hand. A container has no such history.
#
# Ubuntu 24.04 is not an arbitrary choice — it is the current LTS, and it is the
# systemd generation on which defect 4 is fatal. The newest runner is tested too,
# so a divergence between them fails here rather than at a user.

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'hooks/**'
      - 'prompts/**'
      - 'src/daemon/service.rs'
      - 'Cargo.toml'
      - '.github/workflows/install-smoke.yml'
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  install-from-source:
    name: install.sh --local on ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24.04 is the current LTS and the systemd generation where a user unit
        # that touches capabilities refuses to start. 26.04 is what the
        # maintainer's machine runs, i.e. where such a bug hides.
        image: ['ubuntu:24.04', 'ubuntu:26.04']
    container:
      image: ${{ matrix.image }}
      # The installer's own dependency preflight must be exercised, so the
      # container is deliberately bare: no toolchain, no OpenSSL, no cmake.
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Minimal bootstrap (curl, git, jq only)
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          # Everything the installer itself is supposed to arrange is NOT
          # installed here. If this list has to grow to make the job pass, the
          # installer is missing a dependency and that is the finding.
          apt-get install -y --no-install-recommends curl ca-certificates git jq sudo

      - name: Install Rust
        run: |
          set -eux
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: The dependency preflight must REFUSE before consent
        shell: bash
        run: |
          set -eu
          # Exercised in isolation: the point is that it names what is missing
          # and the exact command, rather than letting cargo fail somewhere deep
          # inside a -sys crate's build script.
          out=$(
            LOCAL_MODE=true ASSUME_YES=false \
            bash -c '
              log_warn(){ echo "WARN: $*"; }; log_info(){ echo "INFO: $*"; }
              log_error(){ echo "ERR: $*"; }; log_ok(){ echo "OK: $*"; }
              confirm(){ return 1; }
              eval "$(sed -n "/^ensure_build_deps() {/,/^}/p" install.sh)"
              ensure_build_deps
            ' || true
          )
          echo "$out"
          echo "$out" | grep -q "install command for this system" \
            || { echo "preflight did not print an install command"; exit 1; }
          echo "$out" | grep -q "apt-get install" \
            || { echo "preflight did not detect apt"; exit 1; }

      - name: Run the installer
        shell: bash
        run: bash install.sh --local --yes

      - name: The binary is installed and runs
        shell: bash
        run: |
          set -eux
          test -x "$HOME/.claude/tools/claudebase/claudebase"
          "$HOME/.claude/tools/claudebase/claudebase" --version

      # --local builds from this checkout, so the installed binary has no excuse
      # to be any version but the one in Cargo.toml.
      - name: The installed version is this checkout's
        shell: bash
        run: |
          set -eu
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          got=$("$HOME/.claude/tools/claudebase/claudebase" --version | awk '{print $2}')
          echo "Cargo.toml: $want  installed: $got"
          test "$got" = "$want"

      # Claude Code skips an allow rule that is not `Tool(...)` with a warning,
      # and a skipped rule allows nothing. The installers wrote the bare form
      # for several releases and every check stayed green, because nothing
      # looked at what landed in settings.json.
      - name: settings.json allows claudebase in a form Claude Code accepts
        shell: bash
        run: |
          set -eu
          allow=$(jq -c '.permissions.allow' "$HOME/.claude/settings.json")
          echo "$allow"
          for rule in 'Bash(claudebase *)' 'Bash(~/.claude/tools/claudebase/claudebase *)'; do
            jq -e --arg r "$rule" '.permissions.allow | index($r)' "$HOME/.claude/settings.json" >/dev/null \
              || { echo "missing allow rule: $rule"; exit 1; }
          done
          for legacy in 'claudebase *' '~/.claude/tools/claudebase/claudebase *'; do
            if jq -e --arg r "$legacy" '.permissions.allow | index($r)' "$HOME/.claude/settings.json" >/dev/null; then
              echo "bare rule Claude Code rejects is still there: $legacy"; exit 1
            fi
          done

      - name: The binary links nothing exotic
        shell: bash
        run: |
          set -eu
          libs=$(ldd "$HOME/.claude/tools/claudebase/claudebase" \
                 | awk '{print $1}' | grep -vE 'linux-vdso|ld-linux' | sort -u)
          echo "$libs"
          # OpenSSL is the one that made release binaries refuse to start on a
          # distribution carrying a different major version. The TLS stack is
          # rustls now; if this ever reappears, portability regressed.
          if echo "$libs" | grep -qE 'libssl|libcrypto'; then
            echo "the binary linked OpenSSL again — a release build will not start"
            echo "on distributions with a different OpenSSL major"
            exit 1
          fi

      - name: Hooks are installed AND wired
        shell: bash
        run: |
          set -eu
          # Defect 3: the installer defined a hook installer it never called.
          # Assert the files AND the settings.json wiring, since either half
          # alone was true at some point while the feature did not work.
          for h in claudebase-channel-contract.sh \
                   claudebase-journal-reminder.sh \
                   claudebase-selfcheck-reminder.sh \
                   claudebase-agent-routing-reminder.sh \
                   claudebase-feature-describe.sh; do
            test -f "$HOME/.claude/hooks/$h" || { echo "missing hook: $h"; exit 1; }
          done

          for ev in SessionStart UserPromptSubmit PreToolUse PostToolUse; do
            jq -e ".hooks.\"$ev\" | length > 0" "$HOME/.claude/settings.json" >/dev/null \
              || { echo "settings.json has no $ev hook wired"; exit 1; }
          done

          # The journal reminder rides two events, wired once under each: the
          # full reminder on a session start, the journaling policy on a prompt.
          for ev in SessionStart UserPromptSubmit; do
            jq -e "[.hooks.$ev[].hooks[].command | select(endswith(\"/claudebase-journal-reminder.sh\"))] | length == 1" \
              "$HOME/.claude/settings.json" >/dev/null || { echo "journal reminder not wired exactly once under $ev"; exit 1; }
          done
          echo '{"hook_event_name":"SessionStart"}' | bash "$HOME/.claude/hooks/claudebase-journal-reminder.sh" \
            | jq -r '.hookSpecificOutput.additionalContext' \
            | grep -qF 'claudebase journal add' || { echo "journal reminder does not teach journal add"; exit 1; }
          echo '{"hook_event_name":"UserPromptSubmit"}' | bash "$HOME/.claude/hooks/claudebase-journal-reminder.sh" \
            | jq -e '.hookSpecificOutput | .hookEventName == "UserPromptSubmit" and (.additionalContext | contains("Verifies journal#"))' \
            >/dev/null || { echo "journal reminder gives no policy on a prompt"; exit 1; }

          # The contract has to teach every prefix the transport can produce; a
          # session meeting an unexplained one cannot recover on its own.
          ctx=$(bash "$HOME/.claude/hooks/claudebase-channel-contract.sh" \
                | jq -r '.hookSpecificOutput.additionalContext')
          for token in '[telegram_message]' '[agent-to-agent:' '[callback]'; do
            echo "$ctx" | grep -qF "$token" \
              || { echo "channel contract does not teach $token"; exit 1; }
          done

      - name: Every skill, command, rule and agent in the repo is installed
        shell: bash
        run: |
          set -eu
          # Derived from the repository, not from a hand-written list: a list
          # would silently stop covering whatever was added after it was
          # written, which is exactly how the installer came to ship three
          # skills while announcing four unrelated commands.
          for d in prompts/skills/*/; do
            s=$(basename "$d")
            test -f "$HOME/.claude/skills/$s/SKILL.md" \
              || { echo "skill not installed: $s"; exit 1; }
          done
          for f in prompts/commands/*.md; do
            c=$(basename "$f")
            test -f "$HOME/.claude/commands/$c" \
              || { echo "command not installed: $c"; exit 1; }
          done
          for f in prompts/agents/*.md; do
            a=$(basename "$f")
            test -f "$HOME/.claude/agents/$a" \
              || { echo "agent not installed: $a"; exit 1; }
          done
          for f in prompts/rules/*.md; do
            r=$(basename "$f")
            test -f "$HOME/.claude/rules/$r" \
              || { echo "rule not installed: $r"; exit 1; }
          done
          echo "installed: $(ls prompts/skills | wc -l) skills, $(ls prompts/commands/*.md | wc -l) commands, $(ls prompts/agents/*.md | wc -l) agents, $(ls prompts/rules/*.md | wc -l) rules"

      - name: The daemon starts and answers
        shell: bash
        run: |
          set -eu
          # systemd does not run in this container, so the unit is validated
          # separately (below) and the daemon is exercised directly — what
          # matters here is that the built binary can actually serve.
          export HOME="$HOME"
          "$HOME/.claude/tools/claudebase/claudebase" daemon serve &
          daemon_pid=$!
          # Kill by the pid captured at spawn, never by name: a pattern match
          # would also hit unrelated processes.
          trap 'kill "$daemon_pid" 2>/dev/null || true' EXIT

          # Wait for the SOCKET, not for `daemon status`: that command answers
          # exit 0 with `state: not-installed` before the daemon is up, so
          # polling it raced schema creation and the next command hit a locked
          # database.
          #
          # The path is NOT guessed. The daemon uses $XDG_RUNTIME_DIR/claudebase
          # and falls back to /tmp/claudebase-<uid> when it is unset — which is
          # the container case, and guessing `~/.claude/run` here is what failed
          # the previous run while the daemon was in fact up and listening.
          find_sock() {
            for c in "${XDG_RUNTIME_DIR:-}/claudebase/daemon.sock" \
                     "/tmp/claudebase-$(id -u)/daemon.sock"; do
              [ -S "$c" ] && { echo "$c"; return 0; }
            done
            return 1
          }
          for _ in $(seq 1 60); do
            sock=$(find_sock) && break
            sleep 1
          done
          sock=$(find_sock) || { echo "daemon never created a socket"; exit 1; }
          echo "daemon socket: $sock"

          # And the agent sockets must sit beside it, not somewhere else.
          test -d "$(dirname "$sock")" 
          "$HOME/.claude/tools/claudebase/claudebase" daemon status
          "$HOME/.claude/tools/claudebase/claudebase" daemon callback status

          # The journal is served by the daemon: a read from a plain terminal
          # answers (empty), and a write without a `claudebase run` session is
          # refused with the reason rather than failing on a missing tool.
          cb="$HOME/.claude/tools/claudebase/claudebase"
          "$cb" journal categories --json | jq -e '.categories == []' >/dev/null \
            || { echo "journal categories did not answer"; exit 1; }
          if out=$("$cb" journal add "x" --category decision --tag ci 2>&1); then
            echo "journal add without a session should be refused"; exit 1
          fi
          echo "$out" | grep -qF 'claudebase run' || { echo "unexpected refusal: $out"; exit 1; }

      - name: The generated systemd unit is valid for a USER manager
        shell: bash
        run: |
          set -eu
          apt-get install -y --no-install-recommends systemd >/dev/null 2>&1 || true
          "$HOME/.claude/tools/claudebase/claudebase" daemon install >/dev/null 2>&1 || true
          unit="$HOME/.config/systemd/user/claudebase.service"
          if [ ! -f "$unit" ]; then
            echo "no unit generated; skipping (daemon install needs a systemd session)"
            exit 0
          fi
          cat "$unit"
          # Defect 4: a user manager is itself unprivileged and cannot drop
          # capabilities. Anything that tries makes every start exit
          # 218/CAPABILITIES. ProtectKernelModules counts — it works by dropping
          # CAP_SYS_MODULE.
          for bad in CapabilityBoundingSet AmbientCapabilities ProtectKernelModules; do
            if grep -q "$bad" "$unit"; then
              echo "user unit contains $bad — systemd 255 refuses to start it"
              exit 1
            fi
          done
          if command -v systemd-analyze >/dev/null 2>&1; then
            systemd-analyze verify --user-unit "$unit" || true
          fi

  # The jobs above bootstrap jq and sudo and run as root, which is why none of
  # them saw what a real server hit on 2026-10-27: a root shell with no sudo
  # (every `sudo apt-get` failed), no jq (settings.json was never merged, so no
  # hook was wired), a fresh Claude Code without the official plugin
  # marketplace, and an install interrupted at the model download before the
  # daemon step. Here the container is bare — curl, git and certificates only,
  # what any server has — the binary comes from the newest release like a real
  # install, and the installer's own final checks decide: it exits non-zero
  # when the binary, the daemon or the hooks are not in place.
  install-bare:
    name: bare ${{ matrix.image }} as ${{ matrix.user }}${{ matrix.lsp && ' + language servers' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'ubuntu:24.04', user: root, lsp: true }
          - { image: 'debian:13', user: root, lsp: false }
          - { image: 'ubuntu:24.04', user: dev, lsp: false }
    container:
      image: ${{ matrix.image }}
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Bare bootstrap (curl, git, certificates; no jq, no sudo)
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates git
          ! command -v jq
          ! command -v sudo
          if [ "${{ matrix.user }}" != root ]; then
            useradd -m "${{ matrix.user }}"
            cp install.sh "/home/${{ matrix.user }}/install.sh"
            chown "${{ matrix.user }}" "/home/${{ matrix.user }}/install.sh"
          fi

      - name: Run the installer (its own checks decide)
        shell: bash
        run: |
          set -eu
          flags="--yes --no-models"
          [ "${{ matrix.lsp }}" = true ] || flags="$flags --no-lsp"
          if [ "${{ matrix.user }}" = root ]; then
            bash install.sh $flags
          else
            su "${{ matrix.user }}" -c "cd ~ && bash install.sh $flags"
          fi

      - name: Hooks wired, daemon answering
        shell: bash
        run: |
          set -eu
          # Root's home in a GitHub container job is $HOME (/github/home), not
          # the /root that /etc/passwd names; the installer used $HOME.
          if [ "${{ matrix.user }}" = root ]; then home=$HOME; else home=$(getent passwd "${{ matrix.user }}" | cut -d: -f6); fi
          cb="$home/.claude/tools/claudebase/claudebase"
          jqb=$(command -v jq || echo "$home/.claude/tools/claudebase/bin/jq")
          "$jqb" -e '[.hooks.SessionStart[]?.hooks[]?.command] | any(test("claudebase-channel-contract"))' \
            "$home/.claude/settings.json" >/dev/null || { echo "hooks not wired"; exit 1; }
          if [ "${{ matrix.user }}" = root ]; then "$cb" daemon status; else su "${{ matrix.user }}" -c "$cb daemon status"; fi \
            | grep -q '^state: running' || { echo "daemon not running"; exit 1; }

      - name: Language servers run
        if: matrix.lsp
        shell: bash
        run: |
          set -eu
          export PATH="$HOME/.cargo/bin:$PATH"
          export NVM_DIR="$HOME/.nvm"; set +u; . "$NVM_DIR/nvm.sh"; set -u
          rust-analyzer --version
          pyright --version
          typescript-language-server --version

  install-windows:
    name: install.ps1 on windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Nothing on Linux catches a PowerShell problem, which is how install.ps1
      # came to be unparseable for months: PowerShell 5.1 reads a BOM-less .ps1
      # in the system ANSI codepage, so three UTF-8 em-dashes stopped the whole
      # installer from running and no test noticed.
      - name: install.ps1 parses under Windows PowerShell 5.1
        shell: powershell
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install.ps1), [ref]$null, [ref]$errs)
          if ($errs.Count -gt 0) {
            $errs | ForEach-Object {
              Write-Host ("line " + $_.Extent.StartLineNumber + ": " + $_.Message)
            }
            exit 1
          }
          Write-Host "install.ps1 parses clean"

      - name: install.ps1 is pure ASCII
        shell: powershell
        run: |
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path .\install.ps1))
          $bad = @($bytes | Where-Object { $_ -gt 127 })
          if ($bad.Count -gt 0) {
            Write-Host ("non-ASCII bytes: " + $bad.Count +
                        " -- PowerShell 5.1 mis-decodes them and the script stops parsing")
            exit 1
          }
          Write-Host "ASCII only"

      # The installer downloads the newest RELEASE, not this checkout. Whether
      # it can get the version in Cargo.toml depends on whether that release's
      # Windows binary is published yet: on the commit that bumps the version,
      # this job runs while the release is still building, and the installer
      # correctly falls back to the previous one. So decide BEFORE installing
      # whether the exact version is owed, and hold the installer to it then.
      - name: Which version the installer owes
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $want = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' |
                   Select-Object -First 1).Matches[0].Groups[1].Value
          $url = "https://github.com/codefather-labs/claudebase/releases/download/claudebase-v$want/claudebase-windows-x64.exe"
          $published = $false
          try {
            $r = Invoke-WebRequest -Uri $url -Method Head -UseBasicParsing -MaximumRedirection 5
            $published = ($r.StatusCode -eq 200)
          } catch { }
          Write-Host "Cargo.toml: $want  Windows release published: $published"
          "CB_WANT=$want" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "CB_PUBLISHED=$published" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Run the installer
        shell: powershell
        run: .\install.ps1 -Yes

      - name: The binary is installed and runs
        shell: powershell
        run: |
          $exe = "$env:USERPROFILE\.claude\tools\claudebase\claudebase.exe"
          if (-not (Test-Path $exe)) { Write-Host "binary missing"; exit 1 }
          & $exe --version

      # Claude Code runs an agent's commands in Git Bash, which does not run
      # claudebase.cmd by name: agents on Windows got "command not found" while
      # PowerShell worked. The installer adds an extensionless sh wrapper; bash
      # must find and run it by the bare name.
      - name: Git Bash finds claudebase by name
        shell: bash
        run: |
          set -eu
          export PATH="$(cygpath -u "$USERPROFILE")/.claude/bin:$PATH"
          command -v claudebase
          claudebase --version

      - name: The installed version is the newest published
        shell: powershell
        run: |
          $exe = "$env:USERPROFILE\.claude\tools\claudebase\claudebase.exe"
          $got = ((& $exe --version) -replace '^claudebase ', '').Trim()
          if ($env:CB_PUBLISHED -ne 'True') {
            Write-Host "::warning::v$env:CB_WANT has no published Windows binary yet (release still building, or not tagged); installed $got from the previous release -- not checked"
            exit 0
          }
          Write-Host "owed: $env:CB_WANT  installed: $got"
          if ($got -ne $env:CB_WANT) { Write-Host "installer did not install the newest release"; exit 1 }

      - name: settings.json allows claudebase in a form Claude Code accepts
        shell: powershell
        run: |
          $allow = @((Get-Content "$env:USERPROFILE\.claude\settings.json" -Raw | ConvertFrom-Json).permissions.allow)
          Write-Host ($allow -join ' | ')
          foreach ($rule in @('Bash(claudebase *)', 'Bash(~/.claude/tools/claudebase/claudebase *)')) {
            if ($allow -notcontains $rule) { Write-Host "missing allow rule: $rule"; exit 1 }
          }
          foreach ($legacy in @('claudebase *', '~/.claude/tools/claudebase/claudebase *')) {
            if ($allow -contains $legacy) { Write-Host "bare rule Claude Code rejects is still there: $legacy"; exit 1 }
          }

      - name: Every skill, command, rule and agent is installed
        shell: powershell
        run: |
          $root = "$env:USERPROFILE\.claude"
          $missing = @()
          Get-ChildItem prompts\skills -Directory | ForEach-Object {
            if (-not (Test-Path "$root\skills\$($_.Name)\SKILL.md")) { $missing += "skill: $($_.Name)" }
          }
          foreach ($pair in @(
            @{ src = "prompts\commands"; dst = "$root\commands"; kind = "command" },
            @{ src = "prompts\agents";   dst = "$root\agents";   kind = "agent"   },
            @{ src = "prompts\rules";    dst = "$root\rules";    kind = "rule"    })) {
            Get-ChildItem $pair.src -Filter *.md | ForEach-Object {
              if (-not (Test-Path (Join-Path $pair.dst $_.Name))) {
                $missing += ($pair.kind + ": " + $_.Name)
              }
            }
          }
          if ($missing.Count -gt 0) { $missing | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host "every shipped asset is installed"

      - name: Hooks are wired into settings.json
        shell: powershell
        run: |
          $s = Get-Content "$env:USERPROFILE\.claude\settings.json" -Raw | ConvertFrom-Json
          foreach ($ev in @("SessionStart","UserPromptSubmit","PreToolUse","PostToolUse")) {
            if (-not $s.hooks.$ev) { Write-Host "no $ev hook wired"; exit 1 }
          }
          $ss = @($s.hooks.SessionStart | ForEach-Object { $_.hooks } | ForEach-Object { $_.command })
          if (@($ss | Where-Object { $_ -like '*claudebase-journal-reminder.ps1*' }).Count -ne 1) { Write-Host "journal reminder not wired exactly once"; exit 1 }
          $ups = @($s.hooks.UserPromptSubmit | ForEach-Object { $_.hooks } | ForEach-Object { $_.command })
          if (@($ups | Where-Object { $_ -like '*claudebase-journal-reminder.ps1*' }).Count -ne 1) { Write-Host "journal policy not wired exactly once on UserPromptSubmit"; exit 1 }
          $hook = "$env:USERPROFILE\.claude\hooks\claudebase-journal-reminder.ps1"
          $out = '{"hook_event_name":"UserPromptSubmit"}' | powershell -NoProfile -File $hook | ConvertFrom-Json
          if ($out.hookSpecificOutput.hookEventName -ne 'UserPromptSubmit' -or $out.hookSpecificOutput.additionalContext -notlike '*Verifies journal#*') { Write-Host "journal reminder gives no policy on a prompt"; exit 1 }
          $out = '{"hook_event_name":"SessionStart"}' | powershell -NoProfile -File $hook | ConvertFrom-Json
          if ($out.hookSpecificOutput.additionalContext -notlike '*claudebase journal add*') { Write-Host "journal reminder gives no reminder on a session start"; exit 1 }
          Write-Host "hooks wired"

      # Windows refuses to overwrite a RUNNING .exe, and the daemon from the
      # first install is running by now -- which is what made every upgrade fail
      # with "Cannot create a file when that file already exists".
      - name: Installing twice succeeds while the daemon is running
        shell: powershell
        run: |
          .\install.ps1 -Yes
          $exe = "$env:USERPROFILE\.claude\tools\claudebase\claudebase.exe"
          $got = ((& $exe --version) -replace '^claudebase ', '').Trim()
          Write-Host "after the second install: $got"
          if ($env:CB_PUBLISHED -eq 'True' -and $got -ne $env:CB_WANT) {
            Write-Host "the second install left $got, not $env:CB_WANT"; exit 1
          }

  install-idempotent:
    name: installing twice changes nothing
    runs-on: ubuntu-latest
    container:
      image: 'ubuntu:24.04'
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates git jq sudo
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install, then install again
        shell: bash
        run: |
          set -eu
          bash install.sh --local --yes
          cp "$HOME/.claude/settings.json" /tmp/settings-first.json
          bash install.sh --local --yes
          # An installer that duplicates hook entries on every run quietly
          # multiplies the work a session does at startup, and the growth is
          # invisible until someone reads settings.json.
          if ! diff -u /tmp/settings-first.json "$HOME/.claude/settings.json"; then
            echo "settings.json changed on a second identical install"
            exit 1
          fi
